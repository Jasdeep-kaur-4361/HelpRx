<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FAQ | HelpRX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg professional-navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <span class="helprx mb-0">Help<span>RX</span></span>
            </a>
        </div>
    </nav>
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="fw-bold text-professional mb-4"><i class="fa-solid fa-question-circle me-2"></i>Frequently Asked Questions</h1>
                <div id="faqAccordion" class="accordion"></div>
            </div>
        </div>
    </section>
    <footer class="bg-professional text-white py-3 mt-4">
        <div class="container text-center">
            <small>&copy; 2025 HelpRX. All rights reserved.</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Example dynamic FAQ data (replace with API call for real backend)
        const faqs = [
            {
                question: "How do I find medicines?",
                answer: "Use the search panel or 'Find Medicine' button to search by name or location."
            },
            {
                question: "How can I donate medicines?",
                answer: "Click 'Donate Medicine', fill in the details, and submit your donation."
            },
            {
                question: "Is my information safe?",
                answer: "Yes, HelpRX uses secure technology to keep your data private and safe."
            },
            {
                question: "Who can use HelpRX?",
                answer: "Anyone in need or willing to donate medicines can register and use the platform."
            }
        ];

        function renderFAQ(faqs) {
            const container = document.getElementById('faqAccordion');
            container.innerHTML = faqs.map((faq, idx) => `
                <div class="accordion-item">
                    <h2 class="accordion-header" id="faq${idx}">
                        <button class="accordion-button ${idx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#faqCollapse${idx}" aria-expanded="${idx === 0}" aria-controls="faqCollapse${idx}">
                            ${faq.question}
                        </button>
                    </h2>
                    <div id="faqCollapse${idx}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" aria-labelledby="faq${idx}" data-bs-parent="#faqAccordion">
                        <div class="accordion-body">
                            ${faq.answer}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // For real dynamic: fetch('/api/faqs').then(res => res.json()).then(renderFAQ);
        renderFAQ(faqs);
    </script>
</body>
</html>
